services:
  strapi-cms-postgres:
    image: 'postgres:16.2'
    restart: always
    environment:
      POSTGRES_USER: "strapi"
      POSTGRES_PASSWORD: "strapi"
      POSTGRES_DB: "strapi"
    ports:
      - '5432:5432'
    volumes:
      - strapi-cms-postgres:/var/lib/postgresql/data
volumes:
  strapi-cms-postgres:
